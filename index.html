<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <form action="submit">
            <h1 class="title">CodersClub</h1>
            <input class="user" type="text" name="username" placeholder="Usuário" required>
            <input class="pwd" type="password" name="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
            <p class="register-link">Não tem uma conta? <a href="register.html">Registrar</a></p>
            <p class="forgot-password-link">Esqueceu a senha? <a href="forgot-password.html">Recuperar</a></p>
        </form>
    </div>
</body>
</html>
