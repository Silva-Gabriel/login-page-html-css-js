<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodersClub</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <form onsubmit="SignUp(event)">
            <h1 class="title">CodersClub</h1>
            <input class="name" id="name" type="text" placeholder="Nome Completo">
            <input class="cpf" id="cpf" type="text" placeholder="CPF">
            <input class="email" id="email" type="email" placeholder="Email">
            <input class="user" id="user" type="text" name="username" placeholder="Usuário">
            <input class="pwd" id="pwd" type="password" placeholder="Senha">
            <input class="confirm-pwd" id="confirm-pwd" type="password" placeholder="Confirme sua senha">
            <button class="enter-button" type="submit">Cadastre-se</button>
            <p class="forgot-password-link">Já tem uma conta? <a href="index.html">Entrar</a></p>
        </form>
    </div>
    <script src="../script.js"></script>
</body>
</html>
